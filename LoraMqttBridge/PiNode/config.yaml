# /etc/lora-bridge/config.yaml
# Konfiguration für den Raspberry Pi Zero 2W (Rolle: pi_node)

role: pi_node
log_level: debug         # debug | info | normal

mqtt:
  host: 127.0.0.1        # lokaler Mosquitto (auf dem Pi)
  port: 1883
  # username/password NICHT hier — siehe /etc/lora-bridge/secrets.yaml
  # oder /etc/lora-bridge/secrets.env (überschreibt diese Werte)
  username: null
  password: null
  tls: false
  client_id: lora-bridge-pi
  keepalive: 60

lora:
  chip: sx1262
  frequency_hz: 868000000
  spreading_factor: 7
  bandwidth_hz: 125000
  coding_rate: 6
  tx_power_dbm: 22
  preamble_length: 8
  crc_on: true
  header_explicit: true
  sync_word: 0x1424
  use_tcxo: false
  use_irq: true
  poll_interval_ms: 20
  pins:
    spi_bus: 0
    spi_cs: 0
    gpio_chip: /dev/gpiochip0
    reset: 24
    busy: 23
    dio1: 25
    rxen: 22
    txen: -1

ack:
  timeout_ms: 800
  max_retries: 4
  backoff_factor: 1.6

probe:
  tx_test: true
  tx_test_payload: PROBE

hotspot:
  enabled: false
  ssid: lora-bridge
  passphrase: changeme12345
  channel: 6
  ip_cidr: 192.168.50.1/24

# ------- Topic-Mapping LoRa TopicID <-> MQTT-Topic ---------------------
# Topic and field mappings are merged in the shared topics.yaml (single source of truth)
topics_file: topics.yaml

# ------- Local MQTT Subscriptions & Forwarding (Pi Node) --------------
# Subscribes to local Mosquitto topics, queries JSON, and forwards
# either over LoRa (via target_topic_id) or to another local MQTT topic (target_mqtt_topic).
# source_topic: MQTT topic to subscribe to.
# subscribe_qos: 0 - best effort, 1 min 1x, 2 exact 1x
#
mqtt_subscriptions:
  - name: powermeter_status
    source_topic: "tele/HichiIR/STATE"
    target_topic_id: 10
    subscribe_qos: 1

  - name: powermeter_energy
    source_topic: "tasmota/discovery/483FDA50C720/sensors"
    target_topic_id: 11
    subscribe_qos: 1

  - name: powermeter_power
    source_topic: "tele/HichiIR/SENSOR"
    subscribe_qos: 0
    sample:
      Time: "2026-09-10T06:37:16"
      EMH:
        Power: -13

  - name: battery_power
    source_topic: "homeassistant/sensor/MSA-280425440006/quick/state"
    subscribe_qos: 0
    sample:
      grid_on_p: -48.5
      grid_off_p: 0.0
      bat_sts: "charge"
      bat_p: -48.5
      soc: 31.40
      heat: false
      sys_pv_p: 0.0
      sys_plug_p: -48.5
      sys_bat_p: -48.5
      sys_grid_p: 0.0
      sys_load_p: -48.5
      sys_sp_p: 0.0
      sys_soc: 31.40
      sys_heat: false
      sys_pv2_p: 0.0
      sys_eps_p: 0.0

mqtt_outputs:

  - name: battery_power_control
    # Bei jeder neuen Nachricht einer dieser Subscriptions
    # wird der Output neu berechnet.
    trigger:
      - powermeter_power
      - battery_power

    target_topic: "homeassistant/number/MSA-280425440006/power_ctrl/set"

    inputs:
      powermeter:
        subscription: powermeter_power
        value: ".EMH.Power"
        timestamp: ".Time"
        max_age: 5
      battery:
        subscription: battery_power
        value: ".bat_p"
        timestamp: "$received_at"
        max_age: 5

    validation:
      # 999999 bedeutet beim Powermeter: Messwert ungültig.
      powermeter_error_value: 999999

      # Prüft den vom Powermeter gelieferten Zeitstempel
      # gegen die aktuelle PiNode-Zeit.
      timezone:
        max_offset: 3000       # 50 Minuten
        on_error: latch        # Fehler bleibt gesetzt

    expression: >
      if .powermeter.error
         or .powermeter.stale
      then 0
      else (
        .powermeter.value + .battery.value
        | limit(-800; 800)
      )

# ------- Sensoren am Pi (GPIO/I²C/SPI) ---------------------------------
# I²C nutzt BCM 2/3
sensors:
  - kind: bmp280
    name: keller_bmp280
    i2c_bus: 1
    i2c_address: 0x77
    poll_interval_s: 300
    topic: keller_temperature

  - kind: aht20
    name: keller_aht20
    i2c_bus: 1
    i2c_address: 0x38
    poll_interval_s: 300
    topic: keller_humidity

#  - kind: adc_ads1115     # oder: adc_mcp3008
#    name: keller_wasserstand
#    i2c_bus: 1
#    i2c_address: 0x48
#    channel: 0
#    gain: 4.096
#    field: wasserstand
#    poll_interval_s: 60
#    topic_id: 6
#    mqtt_topic: "sensors/keller/wasserstand"
#    ack_req: true

  # System-Status des Pi selbst (CPU/RAM/Temp/Uptime/WiFi-RSSI).
  # Wird als einzelne Felder publisht (KEINE Gruppierung zu einem Sensor).
  - kind: system_status
    name: pi_system
    poll_interval_s: 300
    topic: bridge/pi_system
