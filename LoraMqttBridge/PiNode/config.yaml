# /etc/lora-bridge/config.yaml
# Konfiguration für den Raspberry Pi Zero 2W (Rolle: pi_node)

role: pi_node
log_level: debug         # debug | info | normal

mqtt:
  host: 127.0.0.1        # lokaler Mosquitto (auf dem Pi)
  port: 1883
  # username/password NICHT hier — siehe /etc/lora-bridge/secrets.yaml
  # oder /etc/lora-bridge/secrets.env (überschreibt diese Werte)
  username: null
  password: null
  tls: false
  client_id: lora-bridge-pi
  keepalive: 60

lora:
  chip: sx1262
  frequency_hz: 868000000
  spreading_factor: 7
  bandwidth_hz: 125000
  coding_rate: 6
  tx_power_dbm: 22
  preamble_length: 8
  crc_on: true
  header_explicit: true
  sync_word: 0x1424
  use_tcxo: false
  use_irq: true
  poll_interval_ms: 20
  pins:
    spi_bus: 0
    spi_cs: 0
    gpio_chip: /dev/gpiochip0
    reset: 24
    busy: 23
    dio1: 25
    rxen: 22
    txen: -1

ack:
  timeout_ms: 800
  max_retries: 4
  backoff_factor: 1.6

probe:
  tx_test: true
  tx_test_payload: PROBE

hotspot:
  enabled: false
  ssid: lora-bridge
  passphrase: changeme12345
  channel: 6
  ip_cidr: 192.168.50.1/24

# ------- Topic-Mapping LoRa TopicID <-> MQTT-Topic ---------------------
# Topic and field mappings are merged in the shared topics.yaml (single source of truth)
topics_file: topics.yaml

# ------- Local MQTT Subscriptions & Forwarding (Pi Node) --------------
# Subscribes to local Mosquitto topics, queries JSON, and forwards
# either over LoRa (via target_topic_id) or to another local MQTT topic (target_mqtt_topic).
mqtt_subscriptions:
  - name: "bms_battery_soc"
    source_topic: "bms/telemetry"
    json_query: "battery.soc"   # Extracts nested property (e.g. {"battery": {"soc": 85.5}})
    target_topic_id: 1          # Forwards over LoRa as Topic ID 1 (solar/battery/soc)
    qos: 1
    retained: true

  - name: "inverter_power_to_battery"
    source_topic: "solar/inverter/status"
    json_query: "PAC"                       # Extracts inverter power
    target_mqtt_topic: "battery/cmd/setpoint"
    payload_template: '{"power": {value}}'
    qos: 1
    retained: false

  - name: "powermeter_status"
    # Subscribes to Tasmota telemetry, extracts Wi-Fi/MQTT counters.
    # jq expression returns flat byte array [b0..b14] (15 bytes) → sent raw over LoRa.
    # NOTE: Tasmota Time has no timezone; fromdateiso8601 fails without Z suffix → 0xFFFFFFFF sentinel.
    #       Set Timeszone 0 (UTC) on tasmota
    # TODO Warn if wrong TZ
    source_topic: "tele/HichiIR/STATE"
    json_query: |-
      [
        (.Time + "Z" | try (fromdateiso8601 - ("2020-01-01T00:00:00Z" | fromdateiso8601)) catch 4294967295 | u32 | be32[]),
        (.UptimeSec | u32 | be32[]),
        (.MqttCount | u8),
        (.Wifi.Signal | . * -1 | u8),
        (.Wifi.RSSI | u8),
        (.Wifi.Downtime | duration_sec | u16 | be16[]),
        (.Wifi.LinkCount | u16 | be16[])
      ] | flatten
    target_topic_id: 10
    qos: 1
    retained: false

  - name: "powermeter_power"
    # Subscribes to Tasmota discovery sensor data (energy meter).
    source_topic: "tasmota/discovery/483FDA50C720/sensors"
    json_query: |-
      [
        (.Time | try (fromdateiso8601 - ("2020-01-01T00:00:00Z" | fromdateiso8601)) catch 4294967295 | u32 | be32[]),
        (.EMH.E_in  | . / 1000 | u16 | be16[]),
        (.EMH.E_out | . / 1000 | u16 | be16[]),
        (.EMH.Power | i16 | be16[])
      ] | flatten
    target_topic_id: 11
    qos: 1
    retained: false

  - name: "powermeter_energy"
    # Subscribes to Tasmota SENSOR topic (live power reading).
    source_topic: "tele/HichiIR/SENSOR"
    json_query: |-
      [
        (.Time | try (fromdateiso8601 - ("2020-01-01T00:00:00Z" | fromdateiso8601)) catch 4294967295 | u32 | be32[]),
        (.EMH.E_in  | . / 1000 | u16 | be16[]),
        (.EMH.E_out | . / 1000 | u16 | be16[]),
        (.EMH.Power | i16 | be16[])
      ] | flatten
    target_topic_id: 11
    qos: 0
    retained: false





# ------- Battery-Relay (2 MQTT-WiFi Topics -> MQTT-WiFi Akku) ----------
battery_relay:
  enabled: true
  sources:
    - "home/loads/power"
    - "solar/inverter/power"
  target: "battery/cmd/setpoint"
  payload_template: "{value}"

# ------- Sensoren am Pi (GPIO/I²C/SPI) ---------------------------------
# I²C nutzt BCM 2/3
sensors:
  - kind: bmp280
    name: keller_bmp280
    i2c_bus: 1
    i2c_address: 0x77
    poll_interval_s: 300
    topic_id: 3 # temperature MQTT topic
    mqtt_topic: "sensors/keller/{field}_bmp"
    ack_req: false
  - kind: aht20
    name: keller_aht20
    i2c_bus: 1
    i2c_address: 0x38
    poll_interval_s: 300
    topic_id: 5 # humidity MQTT topic
    mqtt_topic: "sensors/keller/{field}_aht"
    ack_req: false
#  - kind: adc_ads1115     # oder: adc_mcp3008
#    name: keller_wasserstand
#    i2c_bus: 1
#    i2c_address: 0x48
#    channel: 0
#    gain: 4.096
#    field: wasserstand
#    poll_interval_s: 60
#    topic_id: 6
#    mqtt_topic: "sensors/keller/wasserstand"
#    ack_req: true

  # System-Status des Pi selbst (CPU/RAM/Temp/Uptime/WiFi-RSSI).
  # Wird als einzelne Felder publisht (KEINE Gruppierung zu einem Sensor).
  - kind: system_status
    name: pi_system
    poll_interval_s: 300
    mqtt_topic: "sys/pi/{field}"
    topic_id: 0     # 0 = nur MQTT lokal, nicht über LoRa
