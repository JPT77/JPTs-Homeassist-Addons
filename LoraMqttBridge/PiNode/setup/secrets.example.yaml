# /etc/lora-bridge/secrets.yaml — NIE ins Git-Repo!
#
# Diese Datei überlagert die Werte aus /etc/lora-bridge/config.yaml.
# Rechte: root:root 0600 (siehe install.sh).
#
# Beliebige Config-Keys sind erlaubt — hier üblicherweise nur MQTT-Login:

mqtt:
  username: pi-lora
  password: bitte-hier-echtes-passwort-eintragen

# Optional könntest du auch das ganze mqtt-Block überschreiben, TLS-Ports
# ändern, sync_word geheim halten etc. Alles, was in config.yaml gültig ist,
# ist auch hier gültig.
#
# lora:
#   sync_word: 0x2B5A
